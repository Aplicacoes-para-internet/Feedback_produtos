services:

  db:
    image: mysql:8.0
    container_name: feedback_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: feedback_db
      MYSQL_USER: feedback_user
      MYSQL_PASSWORD: feedback_password

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 5s
      retries: 20
      interval: 5s
      start_period: 10s

  web:
    build: .
    container_name: feedback_app
    restart: always

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://db:3306/feedback_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USER: feedback_user
      DB_PASSWORD: feedback_password

volumes:
  db_data: