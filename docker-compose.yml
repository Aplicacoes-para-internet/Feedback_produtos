services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-docker_root_dev}
      MYSQL_DATABASE: feedback_db
      MYSQL_USER: feedback_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-docker_feedback_dev}
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" --execute="SELECT 1 FROM Produtos LIMIT 0"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - feedback_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/feedback_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USER: feedback_user
      DB_PASSWORD: ${DB_PASSWORD:-docker_feedback_dev}
    ports:
      - "8081:8080"
    networks:
      - feedback_network

volumes:
  db_data:

networks:
  feedback_network:
    driver: bridge
